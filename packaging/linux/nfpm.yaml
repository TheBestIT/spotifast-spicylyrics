# nFPM recipe for the .deb and .rpm packages of the fork. The packages
# workflow replaces @PAYLOAD@ (the unpacked release archive), @VERSION@ (the
# release without its "v") and @ARCH@ (amd64 or arm64) before it runs nFPM.
# The files and dependencies are the same as the upstream native-packages.yaml.
name: spotifast
arch: "@ARCH@"
platform: linux
version: "@VERSION@"
version_schema: semver
section: sound
priority: optional
maintainer: TheBestIT <75973639+TheBestIT@users.noreply.github.com>
vendor: TheBestIT
homepage: https://github.com/TheBestIT/spotifast-spicylyrics
license: MIT
description: |-
  A native Spotify client with word-by-word karaoke lyrics.
  An unofficial fork of Spotifast that adds Spicy Lyrics karaoke lyrics,
  romaji for Japanese songs and a key setup menu. Needs Spotify Premium.
contents:
  - src: "@PAYLOAD@/spotifast"
    dst: /usr/bin/spotifast
    file_info:
      mode: 0755
  - src: "@PAYLOAD@/LICENSE"
    dst: /usr/share/licenses/spotifast/LICENSE
    file_info:
      mode: 0644
  - src: "@PAYLOAD@/README.md"
    dst: /usr/share/doc/spotifast/README.md
    file_info:
      mode: 0644
  - src: "@PAYLOAD@/THIRD-PARTY-NOTICES.md"
    dst: /usr/share/doc/spotifast/THIRD-PARTY-NOTICES.md
    file_info:
      mode: 0644
  - src: "@PAYLOAD@/packaging/applications/spotifast.desktop"
    dst: /usr/share/applications/spotifast.desktop
    file_info:
      mode: 0644
  - src: "@PAYLOAD@/packaging/icons/spotifast.svg"
    dst: /usr/share/icons/hicolor/scalable/apps/spotifast.svg
    file_info:
      mode: 0644
  - src: contrib/omarchy/spotifast.json.tpl
    dst: /usr/share/spotifast/omarchy/spotifast.json.tpl
    file_info:
      mode: 0644
  - src: contrib/omarchy/spotifast-theme
    dst: /usr/share/spotifast/omarchy/spotifast-theme
    file_info:
      mode: 0755
overrides:
  # The GUI opens these libraries at run time, so ELF inspection cannot find
  # them. Keep them aligned with packaging/check-runtime-libs.c.
  deb:
    depends:
      - libdbus-1-3
      - libc6 (>= 2.39)
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libgcc-s1
      - libstdc++6
  rpm:
    depends:
      - dbus-libs
      - glibc >= 2.39
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - pipewire-libs
      - libgcc
      - libstdc++
rpm:
  buildhost: github-actions
