name: CI

# Checks for the Spicy Lyrics fork: formatting, lints and the test suite on
# Linux and Windows, with every feature that ships (MilkDrop included).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (format, lints, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins the compiler; install its components.
      - run: rustup show active-toolchain
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --features demo -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --features demo

  # The build scripts the README tells people to run, run as they would run
  # them on a clean machine.
  linux-script:
    name: Linux build script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-linux.sh --deps --install
      - run: ~/.local/bin/spotifast --version

  windows-script:
    name: Windows build script
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:LOCALAPPDATA\Programs\Spotifast\spotifast.exe" --version

  windows:
    name: Windows (build, tests)
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup show active-toolchain
      # libprojectM (MilkDrop) reads OpenGL through GLEW on Windows.
      - name: GLEW for libprojectM
        run: vcpkg install glew:x64-windows-static
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked --lib --features demo
